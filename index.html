<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Messenger</title>
    <!-- Подключаем TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Стилизация скроллбара для красоты */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Плавные анимации появления */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 h-screen font-sans overflow-hidden text-slate-800" onload="checkAuth()">

    <!-- ЭКРАН ЛОГИНА (Стильный минимализм) -->
    <div id="login-screen" class="relative z-10 flex h-full items-center justify-center bg-gradient-to-br from-indigo-50 to-purple-100">
        <div class="bg-white/80 backdrop-blur-xl p-10 rounded-3xl shadow-2xl w-[400px] text-center border border-white">
            <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg transform rotate-3">
                <svg class="w-10 h-10 text-white transform -rotate-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">Nexus Chat</h2>
            <p class="text-slate-500 mb-8 text-sm">Новое поколение общения</p>

            <div class="relative mb-6">
                <input type="text" id="username" placeholder="Придумайте никнейм" class="w-full pl-4 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-slate-700 font-medium" onkeypress="if(event.key === 'Enter') login()">
            </div>

            <button onclick="login()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-4 rounded-2xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                Начать общение
            </button>
            <p id="error" class="text-red-500 mt-4 hidden text-sm font-medium"></p>
        </div>
    </div>

    <!-- ГЛАВНОЕ ОКНО ПРИЛОЖЕНИЯ -->
    <div id="chat-screen" class="hidden w-full h-full flex bg-slate-50">

        <!-- ЛЕВАЯ ПАНЕЛЬ (Контакты) -->
        <div class="w-[320px] bg-white border-r border-slate-200 flex flex-col z-20 shadow-sm">
            <!-- Шапка профиля -->
            <div class="h-20 px-6 flex items-center justify-between border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center text-white font-bold text-xl shadow-md" id="my-avatar"></div>
                    <div>
                        <span id="my-name" class="block font-bold text-slate-800 leading-tight"></span>
                        <span class="text-xs text-green-500 font-medium">В сети</span>
                    </div>
                </div>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-red-50 hover:text-red-500 transition-colors" title="Выйти">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>

            <!-- Поиск -->
            <div class="p-4">
                <div class="bg-slate-100 rounded-2xl flex items-center px-4 py-3">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="Поиск чатов..." class="bg-transparent border-none focus:outline-none ml-3 w-full text-sm text-slate-700 placeholder-slate-400">
                </div>
            </div>

            <!-- Список чатов -->
            <div class="flex-1 overflow-y-auto px-2">
                <div class="flex items-center px-4 py-4 bg-indigo-50 rounded-2xl cursor-pointer border border-indigo-100 relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500 rounded-r-full"></div>
                    <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center mr-4 shadow-sm text-indigo-500">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-slate-800">Общий чат</h3>
                        <p class="text-sm text-indigo-600 font-medium mt-0.5">Публичная комната</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ (Чат) -->
        <div class="flex-1 flex flex-col bg-slate-50/50 relative">
            <!-- Декоративный фон-градиент -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 opacity-40 pointer-events-none">
                <div class="absolute -top-[20%] -right-[10%] w-[500px] h-[500px] rounded-full bg-indigo-200/50 blur-3xl"></div>
                <div class="absolute bottom-[10%] -left-[10%] w-[400px] h-[400px] rounded-full bg-purple-200/50 blur-3xl"></div>
            </div>

            <!-- Шапка чата -->
            <div class="h-20 bg-white/80 backdrop-blur-md flex items-center px-8 border-b border-slate-200 z-10 shadow-sm">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Общий чат</h2>
                    <p class="text-sm text-slate-500 mt-0.5">Добро пожаловать в мессенджер нового поколения</p>
                </div>
            </div>

            <!-- Область сообщений -->
            <div id="messages" class="flex-1 p-8 overflow-y-auto flex flex-col space-y-4 z-10">
                <!-- Здесь будут сообщения -->
            </div>

            <!-- Панель ввода -->
            <div class="p-6 bg-white/80 backdrop-blur-md border-t border-slate-200 z-10">
                <div class="max-w-4xl mx-auto flex items-end gap-4">
                    <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex items-center px-2 focus-within:ring-2 focus-within:ring-indigo-100 focus-within:border-indigo-400 transition-all">
                        <button class="p-3 text-slate-400 hover:text-indigo-500 transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        </button>
                        <input type="text" id="msg-input" placeholder="Напишите сообщение..." class="flex-1 py-4 px-2 bg-transparent border-none focus:outline-none text-slate-700" onkeypress="if(event.key === 'Enter') sendMsg()">
                    </div>

                    <button onclick="sendMsg()" class="w-14 h-14 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white rounded-3xl flex items-center justify-center shadow-md transform transition hover:scale-105">
                        <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let myUsername = "";

        async function checkAuth() {
            const savedUser = localStorage.getItem("messenger_user");
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                await login();
            }
        }

        async function login() {
            const user = document.getElementById('username').value.trim();
            if (!user) return;
            try {
                await fetch(`/register?username=${user}`, { method: 'POST' });
                const res = await fetch(`/login?username=${user}`, { method: 'POST' });

                if (!res.ok) throw new Error("Ошибка входа");
                const data = await res.json();

                myUsername = user;
                localStorage.setItem("messenger_user", user);

                // Оформляем профиль
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('my-name').innerText = user;
                document.getElementById('my-avatar').innerText = user.charAt(0).toUpperCase();

                await loadHistory();
                connectWS(data.ws_token);
            } catch (err) {
                document.getElementById('error').innerText = "Ошибка сервера. Проверьте консоль.";
                document.getElementById('error').classList.remove('hidden');
            }
        }

        async function loadHistory() {
            const res = await fetch("/history");
            const history = await res.json();
            history.forEach(msg => renderMessage(msg));
        }

        function connectWS(token) {
            ws = new WebSocket(`ws://${window.location.host}/ws?token=${token}`);
            ws.onmessage = (e) => renderMessage(JSON.parse(e.data));
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.classList.add('fade-in', 'max-w-[70%]', 'px-5', 'py-3', 'shadow-sm', 'relative', 'text-[15px]', 'leading-relaxed');

            if (msg.type === 'system') {
                div.classList.add('bg-transparent', 'text-slate-400', 'text-xs', 'text-center', 'mx-auto', 'font-medium', 'my-2', 'shadow-none');
                div.innerText = msg.content;
            } else if (msg.sender === myUsername) {
                // Стиль своих сообщений: Градиентный фон
                div.classList.add('bg-gradient-to-r', 'from-indigo-500', 'to-purple-500', 'text-white', 'self-end', 'rounded-2xl', 'rounded-tr-sm');
                div.innerText = msg.content;
            } else {
                // Стиль чужих сообщений: Белые карточки
                div.classList.add('bg-white', 'text-slate-700', 'self-start', 'rounded-2xl', 'rounded-tl-sm', 'border', 'border-slate-100');
                div.innerHTML = `<span class="text-[13px] font-bold text-indigo-500 block mb-1">${msg.sender}</span>${msg.content}`;
            }

            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(input.value);
                input.value = "";
            }
        }

        function logout() {
            localStorage.removeItem("messenger_user");
            if (ws) ws.close();
            window.location.reload();
        }
    </script>
</body>
</html>
